# Render Blueprint: free DEMO environment of QualiSuite eQMS (see deploy/RENDER-TEST.md).
# Free plan: no persistent disk, so the SQLite data is wiped whenever the service sleeps (about 15 minutes
# without visitors), restarts or redeploys. The demo users are created again at every start.
# To keep data, change plan to starter and add:  disk: {name: qms-data, mountPath: /var/data, sizeGB: 1}
# plus the environment variable DATA_DIR=/var/data.
services:
  - type: web
    name: jrs-eqms-test
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true         # redeploys on every push to the connected branch
    envVars:
      - key: NODE_VERSION
        value: "22"          # node:sqlite needs Node 22.13 or later
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_IDLE_MINUTES
        value: "15"
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD           # generated by Render; read it under Environment in the Render dashboard
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD  # generated by Render; admin must change it at first sign-in
        generateValue: true
      - key: ORG_NAME
        value: Jupiter Research Services (TEST)
      - key: APP_ENV_LABEL
        value: FREE DEMO SYSTEM - data is reset when the app sleeps or restarts; not for GxP records
