# Render Blueprint: shared TEST environment of QualiSuite eQMS (see deploy/RENDER-TEST.md).
# The SQLite database lives on the persistent disk, so test data survives restarts and redeploys.
services:
  - type: web
    name: jrs-eqms-test
    runtime: node
    plan: starter            # a persistent disk needs a paid plan
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true         # redeploys on every push to the connected branch
    disk:
      name: qms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"          # node:sqlite needs Node 22.13 or later
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_IDLE_MINUTES
        value: "15"
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD           # generated by Render; read it under Environment in the Render dashboard
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD  # generated by Render; admin must change it at first sign-in
        generateValue: true
      - key: ORG_NAME
        value: Jupiter Research Services (TEST)
      - key: APP_ENV_LABEL
        value: TEST SYSTEM - for team testing only, not for GxP records
