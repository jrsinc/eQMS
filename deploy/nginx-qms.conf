# /etc/nginx/sites-available/qms
# The server has no public IP. Microsoft Entra Application Proxy (connector) reaches this
# listener on the private network after the user has signed in with Entra ID + MFA.
# Use an internal certificate for the private name (e.g. issued by your internal CA or the same
# certificate as qms.<your-domain> if internal DNS resolves that name to this server).

server {
    listen 443 ssl;
    http2 on;
    server_name qms.your-domain.com;

    ssl_certificate     /etc/ssl/qms/qms.crt;
    ssl_certificate_key /etc/ssl/qms/qms.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 30m;           # attachments up to 25 MB

    # allow only the private network (connector subnet, IT admin subnet)
    allow 10.0.0.0/8;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name qms.your-domain.com;
    return 301 https://$host$request_uri;
}
